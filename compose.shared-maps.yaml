# Optional local development: reuse only the running map services.
# Report storage belongs exclusively to this Manito checkout.
services:
  manito-api:
    build:
      context: ./services/api
    env_file:
      - .env
    environment:
      GROAD_API_KEY: ${GROAD_API_KEY:?Run node scripts/setup.mjs first}
      PORT: "8788"
      HOST: "0.0.0.0"
      OSRM_URL: http://osrm:5000
      NOMINATIM_URL: http://nominatim:8080
      TILES_URL: http://tiles:80
      GROAD_REPORTS_DIR: /app/data/reports
    ports:
      - "127.0.0.1:${MANITO_API_PORT:-8790}:8788"
    volumes:
      - reports:/app/data/reports
    networks:
      - maps
    restart: "no"

networks:
  maps:
    external: true
    name: ${MANITO_MAPS_NETWORK:?Set MANITO_MAPS_NETWORK to an existing map-service network}

volumes:
  reports:
