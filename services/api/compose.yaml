services:
  api:
    build: .
    env_file:
      - ../../.env
    environment:
      KROAD_API_KEY: ${KROAD_API_KEY:?Set KROAD_API_KEY in .env}
      PORT: "8788"
      HOST: "0.0.0.0"
      KROAD_REPORTS_DIR: /app/data/reports
    ports:
      - "127.0.0.1:${MANITO_API_PORT:-8790}:8788"
    volumes:
      - reports_data:/app/data/reports
    restart: unless-stopped
volumes:
  reports_data:
